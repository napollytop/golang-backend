version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: manga_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    #menyimpan data ketika container di matikan
    volumes:
      - manga_db_data:/var/lib/postgresql/data

volumes:
  manga_db_data:
